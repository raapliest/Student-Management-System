<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPMS — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/sapms.css}">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-brand-icon">S</div>
      <h1>SAPMS</h1>
      <p>Student Academic Performance Monitoring System</p>
    </div>
    <div th:if="${param.logout}" class="alert alert-success">✓ You have been signed out successfully.</div>
    <div th:if="${param.error}"  class="alert alert-error">⚠ Invalid username or password. Please try again.</div>
    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-control" type="text" name="username" placeholder="Enter your username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;margin-top:4px;font-size:14px;">
        Sign In →
      </button>
    </form>
    <div class="login-divider"><span>or</span></div>
    <a th:href="@{/register}" class="btn btn-outline" style="width:100%;justify-content:center;">Register as Student</a>
    <div class="demo-box">
      <div class="demo-box-title">Demo Accounts</div>
      <div class="demo-row">
        <span class="badge badge-admin">Admin</span>
        <span class="demo-cred">admin / password</span>
      </div>
      <div class="demo-row">
        <span class="badge badge-lecturer">Lecturer</span>
        <span class="demo-cred">lect01 / password</span>
      </div>
      <div class="demo-row">
        <span class="badge badge-student">Student</span>
        <span class="demo-cred">00101001 / password</span>
      </div>
    </div>
  </div>
</div>
  <script th:src="@{/js/sapms.js}"></script>
</body></html>
