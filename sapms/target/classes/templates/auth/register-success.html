<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPMS — Registration Successful</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/sapms.css}">
</head>
<body>
<div class="login-page">
  <div class="login-box" style="max-width:440px;text-align:center">
    <div style="font-size:52px;margin-bottom:16px;animation:slideDown .5s ease">🎉</div>
    <h2 style="font-size:22px;font-weight:800;color:var(--gray-900);margin-bottom:6px">Registration Successful!</h2>
    <p style="color:var(--gray-400);font-size:13px;margin-bottom:24px">Save your student number — you need it to sign in.</p>
    <div style="background:var(--blue-50);border:1px solid var(--blue-100);border-radius:var(--radius);padding:18px;text-align:left;margin-bottom:24px">
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--blue-100)">
        <span style="font-size:12px;color:var(--gray-500);font-weight:500">Full Name</span>
        <strong style="font-size:13px" th:text="${student.fullName}"></strong>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--blue-100)">
        <span style="font-size:12px;color:var(--gray-500);font-weight:500">Student No</span>
        <strong style="font-size:20px;font-family:monospace;color:var(--blue-700)" th:text="${student.studentNo}"></strong>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0">
        <span style="font-size:12px;color:var(--gray-500);font-weight:500">Initial Password</span>
        <code style="font-size:13px;background:var(--gray-100);padding:2px 8px;border-radius:4px">password</code>
      </div>
    </div>
    <a th:href="@{/login}" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">
      Go to Sign In →
    </a>
  </div>
</div>
  <script th:src="@{/js/sapms.js}"></script>
</body></html>
