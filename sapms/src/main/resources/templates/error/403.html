<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPMS — Access Denied</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/sapms.css}">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--gray-50)">
  <div style="text-align:center;padding:48px 32px;max-width:420px">
    <div style="font-family:'Lora',serif;font-size:80px;font-weight:700;color:var(--gray-200);line-height:1;margin-bottom:16px">403</div>
    <h1 style="font-family:'Lora',serif;font-size:22px;font-weight:700;color:var(--gray-800);margin-bottom:8px">Access Denied</h1>
    <p style="font-size:14px;color:var(--gray-500);margin-bottom:28px">You don't have permission to access this page.</p>
    <a th:href="@{/login}" class="btn btn-primary">Back to Login</a>
  </div>
</div>
</body>
</html>
