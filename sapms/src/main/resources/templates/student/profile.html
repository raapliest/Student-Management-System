<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPMS — My Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/sapms.css}">
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon">S</div>
    <div class="brand-info"><h2>SAPMS</h2><span>Student</span></div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-group">
      <span class="nav-label">Academic</span>
      <a th:href="@{/student/dashboard}"  class="nav-item"><span class="nav-icon">🏠</span>Dashboard</a>
      <a th:href="@{/student/grades}"     class="nav-item"><span class="nav-icon">📝</span>My Grades</a>
      <a th:href="@{/student/attendance}" class="nav-item"><span class="nav-icon">📅</span>Attendance</a>
      <a th:href="@{/student/enrollment}" class="nav-item"><span class="nav-icon">📋</span>Enrollment</a>
      <a th:href="@{/student/ai-advisor}" class="nav-item"><span class="nav-icon">🤖</span>AI Advisor</a>
    </div>
    <div class="nav-group">
      <span class="nav-label">Account</span>
      <a th:href="@{/student/profile}" class="nav-item  active"><span class="nav-icon">👤</span>My Profile</a>
    </div>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="sidebar-avatar" th:text="${student != null ? #strings.substring(student.fullName,0,1) : 'S'}">S</div>
      <div class="sidebar-user-info">
        <p th:text="${student != null ? student.fullName : 'Student'}">Student</p>
        <span>Student</span>
      </div>
    </div>
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn-logout">🚪 Sign Out</button>
    </form>
  </div>
</aside>
<main class="main">
  <div class="topbar"><span class="topbar-title">My Profile</span></div>
  <div class="content">
    <div th:if="${param.success}" class="alert alert-success">✓ Profile updated successfully.</div>
    <div th:if="${pwSuccess}" class="alert alert-success">✓ Password changed successfully.</div>
    <div th:if="${pwError}" class="alert alert-error" th:text="${pwError}"></div>
    <div class="grid-2">
      <div class="card">
        <div class="card-header"><h3>Personal Information</h3></div>
        <div class="card-body">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--gray-100)">
            <div style="width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--blue-500),var(--blue-700));color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0" th:text="${#strings.substring(student.fullName,0,1)}">S</div>
            <div>
              <p style="font-weight:700;font-size:15px;color:var(--gray-800)" th:text="${student.fullName}"></p>
              <p style="font-size:12px;font-family:monospace;color:var(--blue-600);margin-top:2px" th:text="${student.studentNo}"></p>
              <p style="font-size:12px;color:var(--gray-400)" th:text="${student.majorName + ' — ' + student.className}"></p>
            </div>
          </div>
          <form th:action="@{/student/profile/update}" method="post">
            <div class="form-group"><label class="form-label">Full Name</label><input class="form-control" name="fullName" th:value="${student.fullName}" required></div>
            <div class="form-group"><label class="form-label">Email Address</label><input class="form-control" name="email" type="email" th:value="${student.email}"></div>
            <div class="form-group"><label class="form-label">Student No (Username)</label><input class="form-control" th:value="${username}" disabled></div>
            <button type="submit" class="btn btn-primary">Update Profile</button>
          </form>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Change Password</h3></div>
        <div class="card-body">
          <form th:action="@{/student/profile/password}" method="post">
            <div class="form-group"><label class="form-label">Current Password</label><input class="form-control" name="oldPassword" type="password" required></div>
            <div class="form-group"><label class="form-label">New Password <span style="color:var(--gray-400);font-size:11px">(min. 6 chars)</span></label><input class="form-control" name="newPassword" type="password" required minlength="6"></div>
            <button type="submit" class="btn btn-success">Change Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
</div>
  <script th:src="@{/js/sapms.js}"></script>
</body></html>
